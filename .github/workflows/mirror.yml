name: Mirror to GitLab

on:
  push:
    branches:
      - vcpkg-test-branch
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/Nidhish-07/openms.git
          git push gitlab vcpkg-test-branch:vcpkg-test-branch