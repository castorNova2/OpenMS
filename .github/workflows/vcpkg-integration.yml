name: "Vcpkg integration"

on:
  push:
    branches:
      - vcpkg_linux_integration
      - vcpkg-test-branch
  workflow_dispatch:

jobs:
  configure-build-test:
    name: ${{ matrix.variant_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
            compiler_ver: 13
            configure_preset: linux-x64
            variant_name: linux-x64-gcc
          - os: ubuntu-24.04
            compiler: clang++
            compiler_ver: 18
            configure_preset: linux-x64
            variant_name: linux-x64-clang
          - os: ubuntu-24.04-arm
            compiler: g++
            compiler_ver: 13
            configure_preset: linux-arm64
            variant_name: linux-arm64-gcc
          - os: ubuntu-24.04
            compiler: g++
            compiler_ver: 13
            configure_preset: linux-x64
            variant_name: linux-x64-gcc-dbg
            extra_cmake_flags: >-
              -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic-dbg
              -DCMAKE_BUILD_TYPE=RelWithDebInfo

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            autoconf \
            autoconf-archive \
            automake \
            libtool  \
            ccache

          if [[ "${{ matrix.compiler }}" == clang* ]]; then
          sudo apt-get -qq install -y libomp-${{ matrix.compiler_ver }}-dev  \
            clang-${{ matrix.compiler_ver }}
          fi

      - name: Add THIRDPARTY
        shell: bash
        run: |
          # initialize THIRDPARTY
          git submodule update --init THIRDPARTY

          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty

          tp_folder=${{ runner.os }}
          if [ "$tp_folder" = "macOS" ]; then
            tp_folder=MacOS
          fi

          # Copy the correct architecture
          cp -R "THIRDPARTY/$tp_folder/$(uname -m)"/* _thirdparty/

          # Copy architecture independent tools
          cp -R THIRDPARTY/All/* _thirdparty/

          # add third-party binaries to PATH
          for thirdpartytool in '${{ github.workspace }}/_thirdparty'/*; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "${thirdpartytool//\//\\}" >> "$GITHUB_PATH"
            else
              echo "${thirdpartytool}" >> "$GITHUB_PATH"
            fi
          done

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == clang* ]]; then
            echo "CC=clang-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          else
            echo "CC=gcc-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          fi

      - name: Setup ccache cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-ccache-

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p .ccache

          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV

          CCACHE_DIR="${{ github.workspace }}/.ccache" ccache --set-config=max_size=2G

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg

      - name: Override binary cache backend
        run: |
          mkdir -p  "$HOME/.cache/vcpkg/archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> $GITHUB_ENV

      - name: Setup vcpkg cache
        uses: actions/cache@v5
        with: 
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-vcpkg-
      - name: Print vcpkg info
        run: |
          echo "VCPKG_ROOT=${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          echo "TRIPLET=${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}"
          echo "HOME=$HOME"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"

      - name: Runner info
        run: |
          echo "CPU: $(nproc)"
          free -h

      - name: Compiler info
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          $CC --version
          $CXX --version

      - name: ccache status before build
        shell: bash
        run: |
          ccache -s || true

      - name: Configure OpenMS
        run: |
          cmake --preset ${{ matrix.configure_preset }}  \
            -DWITH_THERMO_RAW=OFF  \
            -DWITH_GUI=OFF  \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache  \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache  \
            -DWITH_THERMORAWFILEPARSER_TEST=OFF  \
            ${{ matrix.extra_cmake_flags || '' }}  \
            -DVCPKG_MANIFEST_FEATURES=hdf5  \
            -DWITH_HDF5=ON

      - name: Verify vcpkg libs contain debug symbols
        if: ${{ matrix.variant_name == 'linux-x64-gcc-dbg' }}
        shell: bash
        run: |
          set -euxo pipefail

          LIB=$(find vcpkg/packages/coinutils_x64-linux-dynamic-dbg/lib -name 'libCoinUtils.so*' | head -n 1)

          echo "Checking $LIB"
          readelf -S "$LIB" | grep -E '\.debug_info|\.debug_line|\.debug_abbrev|\.debug_str'

          echo
          grep -R "CMAKE_CXX_FLAGS_RELEASE\|CMAKE_C_FLAGS_RELEASE" vcpkg/buildtrees/coinutils -n || true
          grep -R -- "-g" vcpkg/buildtrees/coinutils -n || true

      - name: Build OpenMS
        run: |
          cmake --build build/${{ matrix.configure_preset }}

      - name: Inspect vcpkg cache archives
        if: always()
        run: |
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"

          echo
          echo "Total size: "
          du -sh "$HOME/.cache/vcpkg/archives" || true

          echo
          echo "Some files"
          find "$HOME/.cache/vcpkg/archives" -name "*.zip" | head -20 || true

      # - name: Upload cache artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: vcpkg-cache
      #     path: ~/.cache/vcpkg/archives

      - name: Test
        shell: bash
        run: |
          cd build/${{ matrix.configure_preset }} && ctest --rerun-failed --output-on-failure

      - name: ccache status after build
        shell: bash
        run: |
          ccache -s || true
