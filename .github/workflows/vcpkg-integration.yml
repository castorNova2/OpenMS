name: "Vcpkg integration"

on:
  push:
    branches:
      - vcpkg_linux_integration
      - vcpkg-test-branch
  workflow_dispatch:

jobs:
  configure-build-test:
    name: ${{ matrix.variant_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
            compiler_ver: 13
            configure_preset: linux-x64-ci
            build_preset: linux-x64-ci
            test_preset: linux-x64-ci
            variant_name: linux-x64-gcc

          - os: ubuntu-24.04
            compiler: clang++
            compiler_ver: 18
            configure_preset: linux-x64-ci
            build_preset: linux-x64-ci
            test_preset: linux-x64-ci
            variant_name: linux-x64-clang

          - os: ubuntu-24.04-arm
            compiler: g++
            compiler_ver: 13
            configure_preset: linux-arm64-ci
            build_preset: linux-arm64-ci
            test_preset: linux-arm64-ci
            variant_name: linux-arm64-gcc

          - os: macos-15
            compiler: xcode
            compiler_ver: "16.4"
            configure_preset: macos-arm64-ci
            build_preset: macos-arm64-ci
            test_preset: macos-arm64-ci
            variant_name: macos-arm64-xcode

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Install build dependencies
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository universe
            sudo apt-get update
            sudo apt-get -qq install -y \
              build-essential \
              cmake \
              autoconf \
              autoconf-archive \
              automake \
              patch \
              libtool \
              git \
              ninja-build \
              xvfb \
              ccache \
              libgl-dev \
              libeigen3-dev \
              libboost-random-dev \
              libboost-regex-dev \
              libboost-iostreams-dev \
              libboost-date-time-dev \
              libboost-math-dev \
              libxerces-c-dev \
              zlib1g-dev \
              libsvm-dev \
              libbz2-dev \
              coinor-libcoinmp-dev \
              libhdf5-dev \
              libsqlite3-dev \
              libsqlitecpp-dev \
              nlohmann-json3-dev \
              libsimde-dev \
              libzip-dev \
              doxygen \
              ghostscript \
              graphviz

            # Install uv
            curl -LsSf https://astral.sh/uv/install.sh | sh

            # Arrow / Parquet system packages
            sudo apt-get install -y -V ca-certificates lsb-release wget
            wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
            sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libcurl4-openssl-dev \
              libarrow-dev \
              libparquet-dev

            if [[ "${{ matrix.compiler }}" == clang* ]]; then
            sudo apt-get -qq install -y libomp-${{ matrix.compiler_ver }}-dev  \
              clang-${{ matrix.compiler_ver }}
            fi
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew update

            brew install \
              ccache
          fi
      
      - name: Debug ccache
        if: runner.os == 'macOS'
        run: |
          brew list ccache || true
          which ccache || true
          ccache --version || true
          
      - name: Add Homebrew to PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          

      - name: Add THIRDPARTY
        shell: bash
        run: |
          # initialize THIRDPARTY
          git submodule update --init THIRDPARTY

          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty

          tp_folder=${{ runner.os }}
          if [ "$tp_folder" = "macOS" ]; then
            tp_folder=MacOS
          fi

          # Copy the correct architecture
          cp -R "THIRDPARTY/$tp_folder/$(uname -m)"/* _thirdparty/

          # Copy architecture independent tools
          cp -R THIRDPARTY/All/* _thirdparty/

          # add third-party binaries to PATH
          for thirdpartytool in '${{ github.workspace }}/_thirdparty'/*; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "${thirdpartytool//\//\\}" >> "$GITHUB_PATH"
            else
              echo "${thirdpartytool}" >> "$GITHUB_PATH"
            fi
          done

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos* ]]; then
            sudo xcode-select -s "/Applications/Xcode_${{ matrix.compiler_ver }}.app/Contents/Developer"
            echo "CC=$(xcrun -f clang)" >> $GITHUB_ENV
            echo "CXX=$(xcrun -f clang++)" >> $GITHUB_ENV
          elif [[ "${{ matrix.compiler }}" == clang* ]]; then
            echo "CC=clang-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          else
            echo "CC=gcc-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          fi

      - name: Setup ccache cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-ccache-

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p .ccache

          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV

          CCACHE_DIR="${{ github.workspace }}/.ccache" ccache --set-config=max_size=2G
      
      - name: Debug Apple SDK
        run: |
          xcode-select -p
          xcrun --show-sdk-path
          xcrun --show-sdk-version

          clang --version
          clang -v

          echo "SDKROOT=$SDKROOT"

          echo '#include <sys/types.h>' > test.c
          clang -c test.c
          
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg

      - name: Override binary cache backend
        run: |
          mkdir -p  "$HOME/.cache/vcpkg/archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> $GITHUB_ENV

      - name: Setup vcpkg cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant_name }}-vcpkg-
      - name: Print vcpkg info
        run: |
          echo "VCPKG_ROOT=${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          echo "TRIPLET=${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}"
          echo "HOME=$HOME"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"

      # - name: Runner info
      #   run: |
      #     echo "CPU: $(nproc)"
      #     free -h

      - name: Compiler info
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          $CC --version
          $CXX --version

      - name: ccache status before build
        shell: bash
        run: |
          ccache -s || true

      - name: Configure OpenMS
        run: |
          cmake --preset ${{ matrix.configure_preset }}  \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache  \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache  \
      #            -DVCPKG_MANIFEST_FEATURES="hdf5;lp-glpk"  \
      #            -DWITH_HDF5=ON  \
      #            -DLP_SOLVER=GLPK  \

      - name: Build OpenMS
        run: |
          cmake --build --preset ${{ matrix.build_preset }}

      - name: Inspect resolved dependency paths
        shell: bash
        run: |
          cache_file="build/${{ matrix.configure_preset }}/CMakeCache.txt"
          echo "Inspecting $cache_file"
          echo

          echo "Core dependency lines from CMakeCache.txt"
          grep -Ei \
            'Boost|BZIP2|Coin|COIN_|GLPK|HIGHS|highs|LP_SOLVER|LPTARGET|EIGEN|HDF5|LIBSVM|LIBZIP|OPENSSL|PARQUET|ARROW|CURL|LibXml2|Qt|SQLITE|XERCES|ZLIB' \
            "$cache_file" || true

          echo
          echo "Resolved paths under vcpkg_installed"
          grep 'vcpkg_installed' "$cache_file" || true

      - name: Inspect vcpkg cache archives
        if: always()
        run: |
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"

          echo
          echo "Total size: "
          du -sh "$HOME/.cache/vcpkg/archives" || true

          echo
          echo "Some files"
          find "$HOME/.cache/vcpkg/archives" -name "*.zip" | head -20 || true

      - name: Test
        shell: bash
        run: |
          ctest --preset ${{ matrix.test_preset }}

      - name: ccache status after build
        shell: bash
        run: |
          ccache -s || true
